name: Build Android APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Initialize AI Flows
      run: |
        echo "Building AI Genkit flows for 0.6.1 Beta..."
        # In a real environment, we'd run 'genkit flow:build' here.
      env:
        GOOGLE_GENAI_API_KEY: "dummy"

    - name: Sync Capacitor project
      run: npm run sync:android
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: "dummy"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dummy"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "dummy"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "dummy"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "dummy"
        NEXT_PUBLIC_FIREBASE_APP_ID: "dummy"

    - name: Fix Kotlin dependency conflict
      run: |
        echo "" >> android/app/build.gradle
        echo "configurations.all {" >> android/app/build.gradle
        echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
        echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
        echo "}" >> android/app/build.gradle

    - name: Build Standard APK
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug -x test --no-daemon
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-standard.apk
      working-directory: ./android

    - name: Upload Standard APK
      uses: actions/upload-artifact@v4
      with:
        name: infinite-standard-apk
        path: android/app/build/outputs/apk/debug/app-standard.apk

    - name: Build Legacy APK (Android 4.1+)
      run: |
        sed -i 's/minSdkVersion .*/minSdkVersion 16/' app/build.gradle
        ./gradlew assembleDebug -x test --no-daemon
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-legacy.apk
      working-directory: ./android

    - name: Upload Legacy APK
      uses: actions/upload-artifact@v4
      with:
        name: infinite-legacy-apk
        path: android/app/build/outputs/apk/debug/app-legacy.apk
