name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Sync Capacitor project
      run: npm run sync:android
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: "dummy"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dummy"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "dummy"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "dummy"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "dummy"
        NEXT_PUBLIC_FIREBASE_APP_ID: "dummy"

    - name: Fix Kotlin dependency conflict
      run: |
        echo "" >> android/app/build.gradle
        echo "configurations.all {" >> android/app/build.gradle
        echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
        echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
        echo "}" >> android/app/build.gradle

    - name: Make gradlew executable
      run: chmod +x ./gradlew
      working-directory: ./android

    - name: Build with Gradle
      run: ./gradlew clean assembleDebug -x test --no-daemon
      working-directory: ./android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
